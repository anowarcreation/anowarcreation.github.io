<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anowar Creation | Under Maintenance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:#03000b;
    color:white;
}

/* ================= BACKGROUND ================= */

.scene{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 65%,
            rgba(73,0,255,.38),
            transparent 42%
        ),
        radial-gradient(
            ellipse at 50% 20%,
            rgba(116,0,255,.20),
            transparent 42%
        ),
        linear-gradient(
            180deg,
            #020008 0%,
            #090019 48%,
            #12002d 100%
        );
}

/* FLOOR */

.floor{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:-8%;
    height:45%;

    background:
        linear-gradient(
            rgba(74,0,255,.18) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(74,0,255,.18) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    transform:
        perspective(500px)
        rotateX(65deg);

    transform-origin:bottom;

    opacity:.65;
}

/* ================= NEON TUNNEL ================= */

.tunnel{
    position:absolute;
    inset:-5%;
    perspective:900px;
}

.frame{
    position:absolute;

    left:50%;
    top:39%;

    width:75vw;
    height:75vw;

    max-width:900px;
    max-height:900px;

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    border:4px solid #8d55ff;

    box-shadow:
        0 0 8px #fff,
        0 0 18px #7d32ff,
        0 0 45px #5a00ff,
        inset 0 0 18px rgba(125,0,255,.5);

    opacity:.9;
}

.frame:nth-child(2){
    width:62vw;
    height:62vw;

    border-color:#b25cff;

    transform:
        translate(-50%,-50%)
        rotate(45deg)
        translateZ(80px);

    opacity:.85;
}

.frame:nth-child(3){
    width:50vw;
    height:50vw;

    border-color:#765cff;

    transform:
        translate(-50%,-50%)
        rotate(45deg)
        translateZ(150px);

    opacity:.8;
}

.frame:nth-child(4){
    width:39vw;
    height:39vw;

    border-color:#a95cff;

    transform:
        translate(-50%,-50%)
        rotate(45deg)
        translateZ(220px);

    opacity:.75;
}

.frame:nth-child(5){
    width:29vw;
    height:29vw;

    border-color:#ffffff;

    transform:
        translate(-50%,-50%)
        rotate(45deg)
        translateZ(290px);

    opacity:.7;
}

/* BLUE SIDE LIGHT */

.blue-glow{
    position:absolute;
    width:45%;
    height:100%;

    right:-15%;
    top:0;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,110,255,.12)
    );

    filter:blur(30px);
}

/* ================= CENTER ================= */

.content{
    position:absolute;
    z-index:20;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;

    padding-top:19vh;
}

/* LOGO */

.logo-icon{
    width:78px;
    height:78px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #bd7cff,
            #5621ff 55%,
            #007cff
        );

    box-shadow:
        0 0 15px #9b42ff,
        0 0 40px rgba(83,0,255,.8),
        inset 0 0 15px rgba(255,255,255,.25);

    font-size:34px;
    font-weight:900;

    font-style:italic;

    margin-bottom:12px;
}

.logo-text{
    font-size:20px;
    font-weight:800;

    letter-spacing:6px;

    color:white;

    text-shadow:
        0 0 8px #ffffff,
        0 0 20px #a300ff,
        0 0 35px #4c00ff;
}

/* TAGLINE */

.tagline{
    margin-top:7px;

    font-size:10px;

    letter-spacing:5px;

    color:#cfc6ff;
}

/* ================= TITLE ================= */

.title{
    margin-top:40px;

    font-size:clamp(45px,8vw,90px);

    line-height:.85;

    font-weight:1000;

    letter-spacing:3px;

    color:white;

    text-transform:uppercase;

    -webkit-text-stroke:1px rgba(255,255,255,.6);

    text-shadow:
        0 2px 0 #9c48ff,
        0 5px 0 #5514b9,
        0 0 10px #ffffff,
        0 0 25px #b000ff,
        0 0 50px #7300ff,
        0 0 90px #4700ff;
}

.title span{
    display:block;

    font-size:.62em;

    margin-top:9px;

    color:#f4eaff;
}

/* ================= GLASS PLATFORM ================= */

.platform{
    position:absolute;

    z-index:10;

    left:50%;
    bottom:14%;

    transform:translateX(-50%);

    width:min(620px,78vw);
    height:125px;

    border:2px solid rgba(130,100,255,.8);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            rgba(62,0,180,.18)
        );

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 15px #742cff,
        0 0 40px rgba(75,0,255,.7),
        inset 0 0 30px rgba(130,80,255,.25);

    transform-style:preserve-3d;
}

/* platform glow */

.platform::before{
    content:"";

    position:absolute;

    left:-15%;
    right:-15%;
    bottom:-35px;

    height:45px;

    background:#4d00ff;

    filter:blur(35px);

    opacity:.65;
}

/* platform top */

.platform-top{
    position:absolute;

    left:4%;
    right:4%;
    top:-27px;

    height:45px;

    transform:skewX(-25deg);

    border:2px solid rgba(170,140,255,.9);

    background:
        linear-gradient(
            135deg,
            rgba(220,200,255,.45),
            rgba(52,0,160,.4)
        );

    box-shadow:
        0 0 25px #7034ff;
}

/* ================= MESSAGE ================= */

.message{
    position:absolute;

    z-index:30;

    bottom:22%;

    width:90%;

    text-align:center;

    font-size:15px;

    line-height:1.6;

    color:#eeeeff;

    text-shadow:
        0 0 8px rgba(160,100,255,.8);
}

/* TIME */

.time{
    position:absolute;

    z-index:40;

    bottom:15.7%;

    left:50%;

    transform:translateX(-50%);

    min-width:220px;

    padding:13px 28px;

    border:2px solid #a85cff;

    border-radius:14px;

    background:rgba(18,0,50,.65);

    box-shadow:
        0 0 8px #ffffff,
        0 0 20px #9c3dff,
        0 0 40px #5b00ff,
        inset 0 0 15px rgba(150,0,255,.25);

    font-size:23px;

    font-weight:900;

    letter-spacing:2px;

    text-shadow:
        0 0 8px #fff,
        0 0 18px #9b3cff;
}

/* ================= THANK YOU ================= */

.thanks{
    position:absolute;

    z-index:30;

    bottom:5.5%;

    text-align:center;

    color:#c9c1dd;

    font-size:14px;

    letter-spacing:2px;
}

.thanks strong{
    display:block;

    margin-top:6px;

    font-size:22px;

    color:white;

    background:linear-gradient(
        90deg,
        #d45cff,
        #ffffff,
        #4d9cff
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:
        drop-shadow(0 0 8px #a600ff)
        drop-shadow(0 0 18px #5000ff);
}

/* ================= ANIMATION ================= */

@keyframes glow{
    0%,100%{
        filter:
            drop-shadow(0 0 5px #ffffff)
            drop-shadow(0 0 15px #8b00ff);
    }

    50%{
        filter:
            drop-shadow(0 0 10px #ffffff)
            drop-shadow(0 0 30px #b000ff)
            drop-shadow(0 0 55px #5500ff);
    }
}

.title,
.logo-icon,
.time{
    animation:glow 3s ease-in-out infinite;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .content{
        padding-top:13vh;
    }

    .logo-icon{
        width:62px;
        height:62px;
        font-size:27px;
    }

    .logo-text{
        font-size:15px;
        letter-spacing:4px;
    }

    .tagline{
        font-size:8px;
        letter-spacing:3px;
    }

    .title{
        margin-top:30px;
        font-size:44px;
    }

    .platform{
        width:85vw;
        height:110px;
        bottom:16%;
    }

    .message{
        bottom:24%;
        font-size:12px;
    }

    .time{
        bottom:17.5%;
        font-size:18px;
        min-width:185px;
    }

    .thanks{
        bottom:6%;
        font-size:11px;
    }

    .thanks strong{
        font-size:18px;
    }

    .frame{
        width:105vw;
        height:105vw;
    }

    .frame:nth-child(2){
        width:88vw;
        height:88vw;
    }

    .frame:nth-child(3){
        width:72vw;
        height:72vw;
    }

    .frame:nth-child(4){
        width:58vw;
        height:58vw;
    }

    .frame:nth-child(5){
        width:44vw;
        height:44vw;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="blue-glow"></div>

    <div class="floor"></div>

    <!-- NEON TUNNEL -->
    <div class="tunnel">
        <div class="frame"></div>
        <div class="frame"></div>
        <div class="frame"></div>
        <div class="frame"></div>
        <div class="frame"></div>
    </div>

    <!-- BRAND + TITLE -->
    <div class="content">

        <div class="logo-icon">AC</div>

        <div class="logo-text">
            ANOWAR CREATION
        </div>

        <div class="tagline">
            — YOUR DIGITAL PARTNER —
        </div>

        <div class="title">
            UNDER
            <span>MAINTENANCE</span>
        </div>

    </div>

    <!-- GLASS PLATFORM -->
    <div class="platform">
        <div class="platform-top"></div>
    </div>

    <!-- MESSAGE -->
    <div class="message">
        Our website is currently under maintenance.<br>
        We will be back and open tomorrow after
    </div>

    <!-- TIME -->
    <div class="time">
        ◷ &nbsp; 8:00 PM
    </div>

    <!-- THANK YOU -->
    <div class="thanks">
        Thanks for Choosing
        <strong>Anowar Creation</strong>
    </div>

</div>

</body>
</html>
