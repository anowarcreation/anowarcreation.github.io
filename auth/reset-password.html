<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Anowar Creation</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><main class="auth-wrap"><div class="auth-brand"><div class="brand-mark">AC</div><h1>Anowar Creation</h1><p>Secure account recovery</p></div><section class="auth-card"><h2>Set New Password</h2><p class="sub">Enter a new password for your account.</p><div id="message" class="auth-message"></div><form id="resetForm"><div class="field"><label for="password">New Password</label><div class="password-row"><input id="password" type="password" autocomplete="new-password" required minlength="6" placeholder="Minimum 6 characters"><button class="show-pass" type="button" data-toggle="password">SHOW</button></div></div><div class="field"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="6" placeholder="Re-enter your password"></div><button class="btn btn-primary auth-submit" type="submit">Update Password →</button></form><div class="auth-links"><a href="login.html">Back to Login</a></div></section></main><script type="module" src="../js/auth.js"></script></body></html>
