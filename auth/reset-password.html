<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Reset | Anowar Creation</title><link rel="stylesheet" href="auth.css"></head><body><main class="auth-wrap"><div class="brand"><h1>Anowar Creation</h1><p>Password recovery</p></div><section class="card"><a class="back" href="login.html">← Back to Login</a><div id="request"><h2>Forgot Password?</h2><p style="color:var(--muted)">Enter your email and we'll send a password reset link.</p><label>Email</label><input id="email" type="email" placeholder="you@example.com"><button class="btn" onclick="resetPassword()">Send Reset Email</button></div><div id="update" class="hidden"><h2>Set New Password</h2><label>New Password</label><input id="password" type="password" placeholder="Minimum 6 characters"><label>Confirm Password</label><input id="confirm" type="password" placeholder="Re-enter password"><button class="btn" onclick="updatePassword()">Update Password</button></div><div id="message" class="msg hidden"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/supabase.js"></script><script>window.supabaseClient=supabaseClient;</script><script src="../js/auth.js"></script><script>sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){document.getElementById('request').classList.add('hidden');document.getElementById('update').classList.remove('hidden')}});</script></body></html>
