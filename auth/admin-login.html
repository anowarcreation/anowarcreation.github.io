<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Anowar Creation</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#17356b,transparent 35%),radial-gradient(circle at 80% 80%,#3b155f,transparent 35%),#050b18;color:#fff;font-family:Arial}.card{width:min(440px,92%);padding:32px;background:#08162cdd;border:1px solid #2677ff;border-radius:22px;box-shadow:0 0 45px #1874ff30}.logo{margin:auto;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:23px;background:linear-gradient(135deg,#15aaff,#7034ff);border:2px solid #6beaff}h1{text-align:center;margin:12px 0 5px}.sub{text-align:center;color:#91a9cf;margin-bottom:25px}label{display:block;font-weight:700;margin:13px 0 7px}input{width:100%;padding:13px;border-radius:11px;border:1px solid #2b4d7d;background:#071329;color:#fff}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:linear-gradient(90deg,#109eff,#7032ff);color:#fff;font-weight:800;cursor:pointer}.msg{text-align:center;min-height:20px;margin-top:13px;color:#ffb2b2}.back{display:block;text-align:center;margin-top:17px;color:#5de1ff;text-decoration:none}</style></head><body><main class="card"><div class="logo">AC</div><h1>Admin Login</h1><div class="sub">Anowar Creation • Secure Admin Portal</div><label>Admin ID / Email</label><input id="email" type="email" placeholder="Enter admin email"><label>Password</label><input id="password" type="password" placeholder="Enter password"><button onclick="loginAdmin()">Login as Admin →</button><div id="msg" class="msg"></div><a class="back" href="../index.html">← Back to Customer Login</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/supabase.js"></script><script>const ADMIN_EMAIL='anowarali2707@outlook.com';async function loginAdmin(){const e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value,m=document.getElementById('msg');if(!e||!p){m.textContent='Admin ID and password are required.';return}m.textContent='Checking...';const {error}=await supabaseClient.auth.signInWithPassword({email:e,password:p});if(error){m.textContent='Invalid Admin ID or password.';return}if(e!==ADMIN_EMAIL.toLowerCase()){await supabaseClient.auth.signOut();m.textContent='This account is not authorized for Admin Panel.';return}location.href='../pages/admin.html'}</script></body></html>
