<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | Anowar Creation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#020611}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;background:radial-gradient(circle at 15% 25%,rgba(26,125,255,.24),transparent 27%),radial-gradient(circle at 82% 75%,rgba(116,49,255,.22),transparent 30%),linear-gradient(135deg,#020611,#07152b 55%,#030712)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 20%,rgba(0,206,255,.08) 38%,transparent 52%,rgba(133,48,255,.08) 70%,transparent 84%)}.card{position:relative;z-index:2;width:min(450px,94vw);padding:32px;background:rgba(5,15,31,.92);border:1px solid rgba(72,218,255,.7);border-radius:24px;box-shadow:0 25px 90px rgba(0,0,0,.72),0 0 55px rgba(35,144,255,.2)}.logo{width:78px;height:78px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:27px;font-weight:900;background:linear-gradient(145deg,#0d2b49,#07111f);border:2px solid #5fe9ff;box-shadow:0 0 25px rgba(45,210,255,.3)}h1{text-align:center;margin:15px 0 5px;font-size:31px}.sub{text-align:center;color:#9db0ca;margin-bottom:25px;letter-spacing:1px;font-size:12px;text-transform:uppercase}label{display:block;font-weight:800;margin:14px 0 7px;color:#dce8f7}input{width:100%;padding:13px;border-radius:11px;border:1px solid #2e527e;background:#08172d;color:#fff;outline:none}input:focus{border-color:#52e5ff}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#1786ff,#16cdb6);color:#fff;font-weight:900;cursor:pointer}.msg{text-align:center;min-height:20px;margin-top:13px;color:#ffb3bd;font-size:12px}.back{display:block;text-align:center;margin-top:17px;color:#57dcff;text-decoration:none;font-weight:700}.home{display:block;text-align:center;margin-top:10px;color:#93a6bf;text-decoration:none;font-size:12px}
</style></head>
<body><main class="card"><div class="logo">AC</div><h1>Admin Login</h1><div class="sub">Anowar Creation • Secure Admin Portal</div><label>Admin ID / Email</label><input id="email" type="email" autocomplete="username" placeholder="Enter admin email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"><button type="button" onclick="loginAdmin()">Login as Admin →</button><div id="msg" class="msg"></div><a class="back" href="../index.html">← Back to Customer Login</a><a class="home" href="../index.html">Customer Portal</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/supabase.js"></script><script>
const ADMIN_EMAIL='anowarali2707@outlook.com';
async function loginAdmin(){const e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value,m=document.getElementById('msg');if(!e||!p){m.textContent='Admin ID and password are required.';return}if(e!==ADMIN_EMAIL.toLowerCase()){m.textContent='Invalid Admin ID or password.';return}m.textContent='Checking admin access...';try{const {error}=await supabaseClient.auth.signInWithPassword({email:e,password:p});if(error){m.textContent=error.message||'Invalid Admin ID or password.';return}m.textContent='Login successful...';location.href='../pages/admin.html'}catch(err){console.error(err);m.textContent='Could not connect to Supabase. Please try again.'}}
</script></body></html>
