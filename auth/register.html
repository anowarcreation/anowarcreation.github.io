<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Anowar Creation</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><main class="auth-wrap"><div class="auth-brand"><div class="brand-mark">AC</div><h1>Anowar Creation</h1><p>Create your customer account</p></div><section class="auth-card"><h2>Create Account</h2><p class="sub">Register once and manage your services and orders from the dashboard.</p><div id="message" class="auth-message"></div><form id="registerForm"><div class="field"><label for="name">Full Name</label><input id="name" type="text" autocomplete="name" required placeholder="Your full name"></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><div class="password-row"><input id="password" type="password" autocomplete="new-password" required minlength="6" placeholder="Minimum 6 characters"><button class="show-pass" type="button" data-toggle="password">SHOW</button></div></div><div class="field"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="6" placeholder="Re-enter password"></div><button class="btn btn-primary auth-submit" type="submit">Create Account →</button></form><div class="auth-links"><a href="login.html">Already have an account? Login</a></div></section><div class="back-home"><a href="../index.html">← Back to Anowar Creation</a></div></main><script type="module" src="../js/auth.js"></script></body></html>
