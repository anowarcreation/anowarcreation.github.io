<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#030b1a">
  <title>Support | Anowar Creation</title>
  <link rel="stylesheet" href="../css/public-site-fixed.css">
  <style>
    body{margin:0;min-height:100vh;background:#030b1a;color:#eef6ff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px;box-sizing:border-box}
    .support-redirect{max-width:620px;text-align:center;padding:36px 28px;border:1px solid #1e5f93;border-radius:22px;background:linear-gradient(145deg,#071a33,#0b1027);box-shadow:0 20px 70px #0007}
    .support-redirect img{width:76px;height:76px;object-fit:contain;margin-bottom:12px}
    .support-redirect h1{margin:6px 0 12px;font-size:clamp(28px,5vw,42px)}
    .support-redirect p{color:#a9c5e7;line-height:1.7}
    .support-redirect a{display:inline-block;margin-top:14px;padding:13px 20px;border-radius:12px;color:white;text-decoration:none;font-weight:800;background:linear-gradient(100deg,#078ef8,#7135fa)}
  </style>
</head>
<body>
  <main class="support-redirect">
    <img src="../assets/anowar-logo.webp" alt="Anowar Creation logo">
    <p>ANOWAR CREATION · CUSTOMER SUPPORT</p>
    <h1>Message the Admin</h1>
    <p>Sign in to open your private support chat. Your messages and replies will be saved in your account so you can return to the conversation later.</p>
    <a href="../index.html?auth=login&amp;service=support">Login and Open Support Chat →</a>
  </main>
</body>
</html>
